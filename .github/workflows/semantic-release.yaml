name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install

      - name: Get pre-release tag
        id: pre-release
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Save branch protection
        env:
          GITHUB_TOKEN: ${{ secrets.REZEPT_CORE_WORKFLOW_AUTOMATION }}
        run: |
          curl --fail-with-body -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/kad-products/rezept-core/branches/main/protection \
          | jq '{
              restrictions: (if .restrictions then {
                users: [.restrictions.users[].login],
                teams: [.restrictions.teams[].slug]
              } else null end),
              required_status_checks: (if .required_status_checks then {
                strict: .required_status_checks.strict,
                contexts: .required_status_checks.contexts
              } else null end),
              enforce_admins: .enforce_admins.enabled,
              required_pull_request_reviews: (if .required_pull_request_reviews then {
                dismiss_stale_reviews: .required_pull_request_reviews.dismiss_stale_reviews,
                require_code_owner_reviews: .required_pull_request_reviews.require_code_owner_reviews,
                required_approving_review_count: .required_pull_request_reviews.required_approving_review_count
              } else null end),
              allow_deletions: .allow_deletions.enabled,
              allow_force_pushes: .allow_force_pushes.enabled,
              block_creations: .block_creations.enabled
            }' > /tmp/branch-protection.json

      - name: Disable branch protection
        env:
          GITHUB_TOKEN: ${{ secrets.REZEPT_CORE_WORKFLOW_AUTOMATION }}
        run: |
          curl --fail-with-body -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/kad-products/rezept-core/branches/main/protection \
            -d '{"restrictions":null,"required_status_checks":null,"enforce_admins":false,"required_pull_request_reviews":null}'

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.REZEPT_CORE_WORKFLOW_AUTOMATION }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@users.noreply.github.com
          HUSKY: 0
        run: pnpm dlx semantic-release

      - name: Re-enable branch protection
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.REZEPT_CORE_WORKFLOW_AUTOMATION }}
        run: |
          curl --fail-with-body -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/kad-products/rezept-core/branches/main/protection \
            -d @/tmp/branch-protection.json

      - name: Trigger Deploy
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.REZEPT_CORE_WORKFLOW_AUTOMATION }}
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$TAG" ] && [ "$TAG" != "${{ steps.pre-release.outputs.tag }}" ]; then
            echo "New release $TAG — triggering deploy"
            gh workflow run deploy.yaml --ref main --field tag="$TAG"
          else
            echo "No new release — skipping deploy"
          fi
