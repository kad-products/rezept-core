name: Playwright Component Tests

on:
  pull_request:
    branches:
      - main

jobs:
  component-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      # Checkout without LFS first so we can detect changed paths before
      # deciding whether to pull LFS objects.
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            design_system:
              - 'src/components/design-system/**'
            forms:
              - 'src/forms/**'
              - 'playwright-ct.config.ts'
              - 'tests/mocks/**'

      - name: Install git-lfs
        if: steps.changes.outputs.design_system == 'true'
        run: apt-get update && apt-get install -y git-lfs

      - name: Pull LFS files
        if: steps.changes.outputs.design_system == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs install
          git lfs pull

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.design_system == 'true' || steps.changes.outputs.forms == 'true'

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.design_system == 'true' || steps.changes.outputs.forms == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.changes.outputs.design_system == 'true' || steps.changes.outputs.forms == 'true'
        run: pnpm install

      - name: Run Playwright component tests
        if: steps.changes.outputs.design_system == 'true' || steps.changes.outputs.forms == 'true'
        run: pnpm playwright-ct:run
        env:
          HOME: /root

      - uses: actions/upload-artifact@v7
        if: ${{ (steps.changes.outputs.design_system == 'true' || steps.changes.outputs.forms == 'true') && !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
